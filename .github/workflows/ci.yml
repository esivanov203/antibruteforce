name: Antibruteforce Service CI

on:
  push:
    branches: ["**"]
    tags: ["*"]

env:
  GOLANG_VERSION: 1.24
  GOLANGCI_LINT_VERSION: v1.63.0

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GOLANG_VERSION }}

      - name: Install golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@${{ env.GOLANGCI_LINT_VERSION }}
          export PATH="$PATH:$(go env GOPATH)/bin"
          golangci-lint --version

      - name: Run Lint
        run: make lint

      - name: Run Tests
        run: make test

  build:
    runs-on: ubuntu-latest
    needs: lint-test
    if: startsWith(github.ref, 'refs/tags/')  # сборка только при пуше тега
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GOLANG_VERSION }}

      - name: Build Server and CLI
        run: make build
