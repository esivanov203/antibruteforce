x-ldflags: &ldflags
  args:
    LDFLAGS: "${LDFLAGS}"

services:
  abs:
    build:
      context: .
      <<: *ldflags
    container_name: ${HOST}
    image: ${HOST}:${RELEASE}
    env_file:
      - .env
    ports:
      - "${PORT}:${INNER_HTTP_PORT}"
    networks:
      - abs_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:${INNER_HTTP_PORT}/health", "||", "exit", "1"]
      interval: 5s
      retries: 3

networks:
  abs_network:
    driver: bridge
