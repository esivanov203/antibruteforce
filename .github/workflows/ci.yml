name: Antibruteforce Service CI

on:
  push:
    branches: ["**"]
    tags: ["*"]

env:
  GOLANG_VERSION: 1.24
  GOLANGCI_LINT_VERSION: v1.63.0

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GOLANG_VERSION }}

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

      - name: Run Lint
        run: make lint

      - name: Run Tests
        run: make test

  build:
    runs-on: ubuntu-latest
    needs: lint-test
    if: startsWith(github.ref, 'refs/tags/')  # build только при push тега
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GOLANG_VERSION }}

      - name: Build Server and CLI
        run: make build
